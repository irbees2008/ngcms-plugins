desc_install = "The x_filter plugin filters news by category and xfields.<hr>No new table is created. If the search index does not already exist, a FULLTEXT index named search will be added to the CMS news table on title and content. The index is required for full-text news search."
desc_deinstall = "The x_filter plugin will be removed.<hr>No table is removed. If the search index exists, it will be dropped from the CMS news table."

msg.installed = 'x_filter is installed. It uses the FULLTEXT search index on the title and content columns of the news table.'
msg.index_failed = 'Could not create the search FULLTEXT index on the news table. The plugin was not marked as installed.'
msg.mark_failed = 'The search index exists, but the plugin installation status could not be saved.'
msg.deinstalled = 'Plugin successfully removed!'
msg.deinstall_failed = 'Could not remove the search index from the news table. The plugin remains installed.'
msg.mark_deinstalled_failed = 'The search index was removed, but the plugin removal status could not be saved.'
msg.back = 'Go back to <a href="?mod=extras">Plugin management.</a>'

