info_title = "<div class='alert alert-info'><h4>Setup instructions:</h4><ol><li><strong>Click “Generate VAPID keys”</strong> in the VAPID settings section above.</li><li>Make sure webpush-sw.js is in the site root.</li><li>To send notifications, use:<br><code>POST /engine/plugins/webpush/send.php?secret=...<br>Parameters: title, body, url</code></li></ol><p><strong>Important:</strong> Web Push requires HTTPS (except on localhost for testing).</p><p style='color:#666;font-size:13px;'>The minishlink/web-push library is included with the plugin (lib/vendor/).</p></div>"
install_confirm = "<p>A table will be created to store Web Push subscriptions.</p><p><strong>Important:</strong></p><ul><li>Web Push requires HTTPS (except on localhost).</li><li>The Composer package <code>composer require minishlink/web-push</code> is required.</li><li>The Service Worker will be copied to the site root (<code>/webpush-sw.js</code>).</li><li>After installation, generate VAPID keys with the send.php?action=genkeys&amp;secret=... request.</li></ul>"
